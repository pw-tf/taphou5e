<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15110e">
<title>TAPHOU5E — Analytics</title>
<link rel="icon" type="image/png" href="taphou5e.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Playfair+Display:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2/css/tokens.css">
<link rel="stylesheet" href="v2/css/ember.css">
<link rel="stylesheet" href="v2/css/v2.css">
<link rel="stylesheet" href="v2/css/analytics.css">
<script src="v2/js/theme.js"></script>
</head>
<body>

<!-- ===== Sign in ===== -->
<div id="gate" class="login-container">
    <header class="login-header">
        <h1><img src="taphou5e.png" alt="" class="login-logo">Analytics</h1>
        <p>Owner dashboard</p>
    </header>
    <main class="login-main">
        <div class="login-card">
            <form id="gate-form">
                <div class="form-group">
                    <label for="gate-email">Email</label>
                    <input type="email" id="gate-email" autocomplete="username" required placeholder="you@example.com">
                </div>
                <div class="form-group" style="margin-top: var(--space-14);">
                    <label for="gate-password">Password</label>
                    <input type="password" id="gate-password" autocomplete="current-password" required placeholder="Password">
                </div>
                <p class="hint" id="gate-error" role="alert" hidden style="color: var(--danger); margin-top: var(--space-10);"></p>
                <button type="submit" class="btn btn-accent btn-block btn-submit" id="gate-submit" style="margin-top: var(--space-18);">Sign in</button>
            </form>
        </div>
        <p class="hint">This dashboard reports totals across every world. It never shows campaign text, DM notes or world secrets.</p>
    </main>
    <footer class="login-footer"><p>TAPHOU5E</p></footer>
</div>

<!-- ===== Dashboard ===== -->
<div id="shell" class="app-shell" hidden>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand"><img src="taphou5e.png" alt="" class="brand-logo">Analytics</div>
        </div>
        <nav class="sidebar-nav" id="side-nav"></nav>
        <div class="sidebar-foot">
            <div class="theme-switch">
                <div class="segmented">
                    <button type="button" data-theme-option="light" onclick="setTheme('light')">Light</button>
                    <button type="button" data-theme-option="dark" onclick="setTheme('dark')">Dark</button>
                    <button type="button" data-theme-option="system" onclick="setTheme('system')">System</button>
                </div>
            </div>
            <a class="side-menu-item" href="index.html">Back to TAPHOU5E</a>
            <div class="side-menu-item side-menu-item-danger" id="sb-signout">Sign out</div>
        </div>
    </aside>

    <div class="app-main">
        <header class="header">
            <div style="flex:1; min-width:0;">
                <div class="header-title">Analytics</div>
                <div class="header-sub" id="m-generated">—</div>
            </div>
            <button class="icon-btn" id="m-refresh" title="Refresh" aria-label="Refresh">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="icon-btn" id="m-signout" title="Sign out" aria-label="Sign out">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </header>

        <div class="topbar">
            <h1>Analytics</h1>
            <div class="spacer">
                <span class="hint" id="d-generated" style="align-self:center;">—</span>
                <button class="btn btn-quiet" id="d-refresh">Refresh</button>
            </div>
        </div>

        <main class="main-content an-main" id="content">
            <div class="an-loading"><div class="an-spinner"></div><p>Loading analytics…</p></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="v2/js/analytics.js"></script>
</body>
</html>
